name: Deploy Web to GitHub Pages

# The wasm is compiled once by the "Build" workflow. This workflow only waits
# for that run, pulls its `re-ch-rzl-rust-web-*` artifacts and publishes them,
# so a master push never builds the web target twice.
#
# GitHub Pages must be switched to "GitHub Actions" as the source in the repo
# settings once.

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [master]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download multifile web build
        uses: actions/download-artifact@v6
        with:
          name: re-ch-rzl-rust-web-multifile
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: site

      - name: Download single-file web build
        uses: actions/download-artifact@v6
        with:
          name: re-ch-rzl-rust-web-single
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: single

      - name: Assemble site
        run: |
          cp single/re-ch-rzl-rust.html site/single.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
