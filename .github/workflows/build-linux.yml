name: Build Linux

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          # Native arm64 runner: cross-compiling would need an arm64 sysroot
          # with X11/ALSA/GL dev packages, which is far more fragile.
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Subset font
        uses: ./.github/actions/subset-font

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: re-ch-rzl-rust-linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/re-ch-rzl-rust
          if-no-files-found: error
