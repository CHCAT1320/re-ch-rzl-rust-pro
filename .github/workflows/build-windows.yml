name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - 'diff/**'
      - 'README.md'
      - '.github/workflows/commit-diff-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: re-ch-rzl-rust-windows
            path: target/release/re-ch-rzl-rust.exe
          - os: macos-latest
            artifact: re-ch-rzl-rust-macos
            path: target/release/re-ch-rzl-rust
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
