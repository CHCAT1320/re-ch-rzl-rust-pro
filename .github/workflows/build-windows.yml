name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
          # Native Windows on Arm runner: no ARM64 MSVC cross toolchain needed.
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The committed subset font is used as-is on arm64, where actions/setup-python
      # has no Windows arm64 build.
      - name: Subset font
        if: matrix.arch != 'aarch64'
        uses: ./.github/actions/subset-font

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: re-ch-rzl-rust-windows-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/re-ch-rzl-rust.exe
          if-no-files-found: error
