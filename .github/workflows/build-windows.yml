name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'diff/**'
      - 'README.md'
      - '.github/workflows/commit-diff-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: re-ch-rzl-rust-windows
          path: target/release/re-ch-rzl-rust.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p out
          lipo -create \
            target/aarch64-apple-darwin/release/re-ch-rzl-rust \
            target/x86_64-apple-darwin/release/re-ch-rzl-rust \
            -output out/re-ch-rzl-rust
          lipo -archs out/re-ch-rzl-rust

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: re-ch-rzl-rust-macos
          path: out/re-ch-rzl-rust
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: re-ch-rzl-rust-linux
          path: target/release/re-ch-rzl-rust
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build wasm
        run: cargo rustc --release --target wasm32-unknown-unknown -- -C link-arg=--allow-undefined

      - name: Package web
        run: |
          python3 .github/scripts/build_web.py \
            --wasm target/wasm32-unknown-unknown/release/re-ch-rzl-rust.wasm \
            --out dist/web

      - name: Upload multifile
        uses: actions/upload-artifact@v6
        with:
          name: re-ch-rzl-rust-web-multifile
          path: dist/web/multifile/
          if-no-files-found: error

      - name: Upload single html
        uses: actions/upload-artifact@v6
        with:
          name: re-ch-rzl-rust-web-single
          path: dist/web/single/re-ch-rzl-rust.html
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Package assets
        run: |
          cd dist/re-ch-rzl-rust-web-multifile
          zip -r ../re-ch-rzl-rust-web-multifile.zip .
          cd ../..
          cp dist/re-ch-rzl-rust-macos/re-ch-rzl-rust dist/re-ch-rzl-rust-macos
          cp dist/re-ch-rzl-rust-linux/re-ch-rzl-rust dist/re-ch-rzl-rust-linux
          cp dist/re-ch-rzl-rust-web-single/re-ch-rzl-rust.html dist/re-ch-rzl-rust-web-single.html
          ls -R dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets=(
            dist/re-ch-rzl-rust-windows/re-ch-rzl-rust.exe
            dist/re-ch-rzl-rust-macos
            dist/re-ch-rzl-rust-linux
            dist/re-ch-rzl-rust-web-multifile.zip
            dist/re-ch-rzl-rust-web-single.html
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes "${assets[@]}"
          fi
