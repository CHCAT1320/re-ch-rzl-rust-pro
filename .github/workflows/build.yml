name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'diff/**'
      - 'README.md'
      - '.github/workflows/commit-diff-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml

  macos:
    uses: ./.github/workflows/build-macos.yml

  linux:
    uses: ./.github/workflows/build-linux.yml

  web:
    uses: ./.github/workflows/build-web.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Package assets
        run: |
          cd dist/re-ch-rzl-rust-web-multifile
          zip -r ../re-ch-rzl-rust-web-multifile.zip .
          cd ../..
          cp dist/re-ch-rzl-rust-macos/re-ch-rzl-rust dist/re-ch-rzl-rust-macos
          cp dist/re-ch-rzl-rust-linux/re-ch-rzl-rust dist/re-ch-rzl-rust-linux
          cp dist/re-ch-rzl-rust-web-single/re-ch-rzl-rust.html dist/re-ch-rzl-rust-web-single.html
          ls -R dist

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets=(
            dist/re-ch-rzl-rust-windows/re-ch-rzl-rust.exe
            dist/re-ch-rzl-rust-macos
            dist/re-ch-rzl-rust-linux
            dist/re-ch-rzl-rust-web-multifile.zip
            dist/re-ch-rzl-rust-web-single.html
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes "${assets[@]}"
          fi
