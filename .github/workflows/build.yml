name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'diff/**'
      - 'README.md'
      - '.github/workflows/commit-diff-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag, e.g. v0.1.0. Leave empty to only build artifacts.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml

  macos:
    uses: ./.github/workflows/build-macos.yml

  linux:
    uses: ./.github/workflows/build-linux.yml

  web:
    uses: ./.github/workflows/build-web.yml

  ios:
    uses: ./.github/workflows/build-ios.yml

  # Publishes the web build that the `web` job just uploaded to GitHub Pages.
  # Running as a job inside this workflow (instead of a workflow_run workflow)
  # keeps it on the same graph and guarantees it only reacts to this run's own
  # artifacts, never to a superseded run. Needs Pages source = "GitHub Actions".
  pages:
    needs: [web]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download multifile web build
        uses: actions/download-artifact@v6
        with:
          name: re-ch-rzl-rust-web-multifile
          path: site

      - name: Download single-file web build
        uses: actions/download-artifact@v6
        with:
          name: re-ch-rzl-rust-web-single
          path: single

      - name: Assemble site
        run: |
          cp single/re-ch-rzl-rust.html site/single.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages with the GitHub Actions source on the first run instead
          # of failing until it is switched on manually in the repo settings.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    # Tag pushes and manual runs with a tag publish; manual runs without one
    # only build artifacts. Branch pushes keep a rolling draft up to date.
    if: github.event_name != 'workflow_dispatch' || inputs.tag != ''
    needs: [windows, macos, linux, web, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for Cargo.toml (draft tag) and for gh to resolve the repository.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Package assets
        run: |
          mkdir -p release
          # One zip per platform/arch so every asset has an extension. Info-ZIP
          # records Unix permissions, so unzip restores the executable bit.
          for name in \
            re-ch-rzl-rust-windows-x86_64 \
            re-ch-rzl-rust-windows-aarch64 \
            re-ch-rzl-rust-macos-universal \
            re-ch-rzl-rust-linux-x86_64 \
            re-ch-rzl-rust-linux-aarch64 \
            re-ch-rzl-rust-web-multifile \
            re-ch-rzl-rust-web-single
          do
            (
              cd "dist/$name"
              zip -r "../../release/$name.zip" .
            )
          done
          # The iOS artifacts are already archives, ship them as-is.
          cp dist/re-ch-rzl-rust-ios-arm64/re-ch-rzl-rust-ios-arm64.ipa release/
          cp dist/re-ch-rzl-rust-ios-simulator-universal/re-ch-rzl-rust-ios-simulator-universal.zip \
             release/
          ls -l release

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          requested="${{ inputs.tag }}"
          if [ -n "$requested" ]; then
            tag="$requested"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            tag="v${version}-draft"
          fi
          echo "release tag: $tag"
          assets=(
            release/re-ch-rzl-rust-windows-x86_64.zip
            release/re-ch-rzl-rust-windows-aarch64.zip
            release/re-ch-rzl-rust-macos-universal.zip
            release/re-ch-rzl-rust-linux-x86_64.zip
            release/re-ch-rzl-rust-linux-aarch64.zip
            release/re-ch-rzl-rust-ios-arm64.ipa
            release/re-ch-rzl-rust-ios-simulator-universal.zip
            release/re-ch-rzl-rust-web-multifile.zip
            release/re-ch-rzl-rust-web-single.zip
          )
          assets_block=$(mktemp)
          notes=$(mktemp)

          cat > "$assets_block" <<'EOF'
          ## 资源

          | 文件 | 平台 |
          | --- | --- |
          | `re-ch-rzl-rust-windows-x86_64.zip` | Windows x86_64（64 位，内含 exe） |
          | `re-ch-rzl-rust-windows-aarch64.zip` | Windows ARM64（内含 exe） |
          | `re-ch-rzl-rust-macos-universal.zip` | macOS 通用二进制（Intel + Apple Silicon） |
          | `re-ch-rzl-rust-linux-x86_64.zip` | Linux x86_64 |
          | `re-ch-rzl-rust-linux-aarch64.zip` | Linux ARM64 |
          | `re-ch-rzl-rust-ios-arm64.ipa` | iOS 真机 arm64（未签名，需自行重签后才能装到设备） |
          | `re-ch-rzl-rust-ios-simulator-universal.zip` | iOS 模拟器（arm64 + x86_64 通用 app） |
          | `re-ch-rzl-rust-web-multifile.zip` | web 多文件版 |
          | `re-ch-rzl-rust-web-single.zip` | web 单文件版（内含 html） |

          解压后运行；macOS 若用 Finder 解压可能丢失可执行位，建议命令行 `unzip`。字体与打击音已内嵌，仅需自备谱面和音乐。

          web 单文件版可直接用浏览器打开，但需要通过 HTTP 访问，`file://` 无法加载 wasm。
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            # Only the marked asset region is rewritten, so hand-written text in
            # the draft survives while the asset list stays current.
            gh release view "$tag" --json body --jq .body > "$notes"
            python3 .github/scripts/update_release_body.py "$notes" "$assets_block"
            gh release edit "$tag" --notes-file "$notes"

            # --clobber only replaces same-named files, so assets from earlier
            # naming schemes would pile up; drop anything not in the list.
            keep=$(printf '%s\n' "${assets[@]}" | xargs -n1 basename)
            gh release view "$tag" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              if ! printf '%s\n' "$keep" | grep -Fqx -- "$name"; then
                echo "removing stale asset: $name"
                gh release delete-asset "$tag" "$name" --yes
              fi
            done
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            : > "$notes"
            python3 .github/scripts/update_release_body.py "$notes" "$assets_block"
            gh release create "$tag" --draft --title "$tag" --notes-file "$notes" "${assets[@]}"
          fi
