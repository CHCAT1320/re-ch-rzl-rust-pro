name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'diff/**'
      - 'README.md'
      - '.github/workflows/commit-diff-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag, e.g. v0.1.0. Leave empty to only build artifacts.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml

  macos:
    uses: ./.github/workflows/build-macos.yml

  linux:
    uses: ./.github/workflows/build-linux.yml

  web:
    uses: ./.github/workflows/build-web.yml

  release:
    # Tag pushes and manual runs with a tag publish; manual runs without one
    # only build artifacts. Branch pushes keep a rolling draft up to date.
    if: github.event_name != 'workflow_dispatch' || inputs.tag != ''
    needs: [windows, macos, linux, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Needed for Cargo.toml (draft tag) and for gh to resolve the repository.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Package assets
        run: |
          mkdir -p release
          cd dist/re-ch-rzl-rust-web-multifile
          zip -r ../../release/re-ch-rzl-rust-web-multifile.zip .
          cd ../..
          cp dist/re-ch-rzl-rust-windows/re-ch-rzl-rust.exe release/re-ch-rzl-rust.exe
          cp dist/re-ch-rzl-rust-macos/re-ch-rzl-rust release/re-ch-rzl-rust-macos
          cp dist/re-ch-rzl-rust-linux/re-ch-rzl-rust release/re-ch-rzl-rust-linux
          cp dist/re-ch-rzl-rust-web-single/re-ch-rzl-rust.html release/re-ch-rzl-rust-web-single.html
          ls -l release

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          requested="${{ inputs.tag }}"
          if [ -n "$requested" ]; then
            tag="$requested"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            tag="v${version}-draft"
          fi
          echo "release tag: $tag"
          assets=(
            release/re-ch-rzl-rust.exe
            release/re-ch-rzl-rust-macos
            release/re-ch-rzl-rust-linux
            release/re-ch-rzl-rust-web-multifile.zip
            release/re-ch-rzl-rust-web-single.html
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            notes=$(mktemp)
            cat <<'EOF' > "$notes"
          ## 资源

          | 文件 | 平台 |
          | --- | --- |
          | `re-ch-rzl-rust.exe` | Windows |
          | `re-ch-rzl-rust-macos` | macOS（Intel + Apple Silicon 通用二进制） |
          | `re-ch-rzl-rust-linux` | Linux x86_64 |
          | `re-ch-rzl-rust-web-multifile.zip` | web 多文件版 |
          | `re-ch-rzl-rust-web-single.html` | web 单文件版 |

          Windows / macOS 双击即可运行；Linux 需 `chmod +x`。字体与打击音已内嵌，仅需自备谱面和音乐。

          web 单文件版可直接用浏览器打开，但需要通过 HTTP 访问，`file://` 无法加载 wasm。

          ## 变更

          EOF
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$tag" -f target_commitish="${GITHUB_SHA}" \
              --jq .body >> "$notes" 2>/dev/null \
              || echo "_暂无可自动生成的变更记录_" >> "$notes"

            gh release create "$tag" --draft --title "$tag" --notes-file "$notes" "${assets[@]}"
          fi
