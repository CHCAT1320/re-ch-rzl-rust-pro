name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'diff/**'
      - 'README.md'
      - '.github/workflows/commit-diff-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag, e.g. v0.1.0. Leave empty to only build artifacts.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml

  macos:
    uses: ./.github/workflows/build-macos.yml

  linux:
    uses: ./.github/workflows/build-linux.yml

  web:
    uses: ./.github/workflows/build-web.yml

  release:
    # Tag pushes and manual runs with a tag publish; manual runs without one
    # only build artifacts. Branch pushes keep a rolling draft up to date.
    if: github.event_name != 'workflow_dispatch' || inputs.tag != ''
    needs: [windows, macos, linux, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Package assets
        run: |
          cd dist/re-ch-rzl-rust-web-multifile
          zip -r ../re-ch-rzl-rust-web-multifile.zip .
          cd ../..
          cp dist/re-ch-rzl-rust-macos/re-ch-rzl-rust dist/re-ch-rzl-rust-macos
          cp dist/re-ch-rzl-rust-linux/re-ch-rzl-rust dist/re-ch-rzl-rust-linux
          cp dist/re-ch-rzl-rust-web-single/re-ch-rzl-rust.html dist/re-ch-rzl-rust-web-single.html
          ls -R dist

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          requested="${{ inputs.tag }}"
          if [ -n "$requested" ]; then
            tag="$requested"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            tag="v${version}-draft"
          fi
          echo "release tag: $tag"
          assets=(
            dist/re-ch-rzl-rust-windows/re-ch-rzl-rust.exe
            dist/re-ch-rzl-rust-macos
            dist/re-ch-rzl-rust-linux
            dist/re-ch-rzl-rust-web-multifile.zip
            dist/re-ch-rzl-rust-web-single.html
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes "${assets[@]}"
          fi
