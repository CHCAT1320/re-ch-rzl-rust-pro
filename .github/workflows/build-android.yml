name: Build Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Subset font
        uses: ./.github/actions/subset-font

      - name: Configure Android SDK
        run: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          # GitHub's Ubuntu images ship an NDK; do not download another one.
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$NDK" ] && [ -d "$SDK/ndk" ]; then
            NDK=$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::no Android NDK found under $SDK/ndk"
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          # Keep sdkmanager reachable in case cargo-apk2 shells out to it.
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)
          if [ -n "$SDKMANAGER" ]; then
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          fi
          echo "SDK: $SDK"
          echo "NDK: $NDK"

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked

      - name: Create debug keystore
        run: |
          mkdir -p android
          keytool -genkeypair -keystore android/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: cargo apk2 build --lib --release

      - name: Collect APK
        run: |
          set -eu
          apk=$(find target -name '*.apk' | head -n 1)
          test -n "$apk"
          mkdir -p dist
          cp "$apk" dist/re-ch-rzl-rust-android-arm64.apk
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: re-ch-rzl-rust-android-arm64
          path: dist/re-ch-rzl-rust-android-arm64.apk
          if-no-files-found: error
